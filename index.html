<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predictor Mundial 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter','Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:#0a0f1e;color:#e0e0e0;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(26,60,40,0.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(26,40,60,0.3) 0%,transparent 50%);
}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.05) 0%,transparent 50%),radial-gradient(1px 1px at 50% 70%,rgba(255,255,255,0.05) 0%,transparent 50%),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,0.04) 0%,transparent 50%);background-size:200px 200px}
.header{text-align:center;padding:30px 20px 12px}
.header h1{font-size:40px;font-weight:900;background:linear-gradient(135deg,#FFD700,#FF8C00,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.header .sub{color:#667;font-size:13px;margin-top:2px}
.header .sub span{color:#FFD700;-webkit-text-fill-color:#FFD700}
.divider{text-align:center;padding:8px 0;font-size:18px;color:rgba(255,215,0,0.12);letter-spacing:6px}
section{max-width:1440px;margin:0 auto 24px;padding:0 20px}
.section-title{font-size:18px;font-weight:700;color:#FFD700;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(255,215,0,0.1);display:flex;align-items:center;gap:8px}
#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.grp{background:linear-gradient(160deg,rgba(20,32,56,0.92),rgba(12,20,38,0.95));border-radius:12px;padding:14px;border:1px solid rgba(40,60,90,0.4)}
.grp h3{font-size:13px;color:#90CAF9;margin-bottom:8px}
.matches{display:flex;flex-direction:column;gap:4px}
.mt{display:flex;align-items:center;gap:6px;padding:2px 0}
.mt .tn{font-size:11px;min-width:72px;display:flex;align-items:center;gap:4px}
.mt .tn:first-child{text-align:right;justify-content:flex-end}
.mt .tn:last-child{text-align:left}
.mt .tn img{width:16px;height:12px;border-radius:2px;vertical-align:middle}
.mt select{flex:1;padding:5px 6px;font-size:11px;font-family:'Inter',sans-serif;border:1px solid rgba(40,60,90,0.5);border-radius:6px;background:rgba(10,18,36,0.8);color:#bbb;cursor:pointer;outline:none}
.mt select:focus{border-color:#4FC3F7}
.mt select option{background:#0a1224;color:#bbb}
.st{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px;border-radius:6px;overflow:hidden}
.st th{background:rgba(10,18,36,0.6);color:#90CAF9;padding:5px 4px;text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid rgba(40,60,90,0.3)}
.st td{padding:5px 4px;text-align:center;border-bottom:1px solid rgba(20,32,56,0.4);font-size:11px;vertical-align:middle}
.st tr td:first-child{width:22px;color:#445}
.st tr td:nth-child(2){text-align:left;padding-left:8px;font-weight:600}
.st tr td:nth-child(2) img{width:16px;height:12px;border-radius:2px;vertical-align:middle;margin-right:4px}
.st tr.q td{color:#81C784}
.st tr.q{background:rgba(76,175,80,0.06)}
.st tr.t td{color:#FFD54F}
.st tr.t{background:rgba(255,213,79,0.04)}
.pts{display:inline-block;background:rgba(10,18,36,0.8);color:#FFD700;border-radius:10px;padding:1px 8px;font-weight:700;font-size:12px;border:1px solid rgba(255,215,0,0.15);min-width:26px;text-align:center}
#qualifiers{background:linear-gradient(160deg,rgba(20,32,56,0.85),rgba(12,20,38,0.9));border-radius:12px;padding:16px;border:1px solid rgba(40,60,90,0.35)}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px;margin:6px 0}
.qi{padding:4px 10px;border-radius:4px;font-size:11px;background:rgba(10,18,36,0.3);display:flex;align-items:center;gap:6px}
.qi img{width:14px;height:10px;border-radius:1px}
.qi strong{color:#90CAF9;margin-right:2px}
.q1{color:#81C784;font-weight:600}
.q2{color:#64B5F6;font-weight:600}
.ts{margin-top:10px;padding-top:10px;border-top:1px solid rgba(40,60,90,0.2)}
.ts h4{color:#90CAF9;font-size:11px;margin-bottom:6px;font-weight:500}
.tg{display:flex;flex-wrap:wrap;gap:4px}
.tc{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:500}
.tc img{width:14px;height:10px;border-radius:1px}
.ti{background:rgba(76,175,80,0.12);color:#81C784;border:1px solid rgba(42,90,42,0.4)}
.to{background:rgba(244,67,54,0.07);color:#EF5350;border:1px solid rgba(74,26,26,0.25);text-decoration:line-through;opacity:0.4}
.br{overflow-x:auto;padding:6px 0 16px}
.bf{display:flex;gap:0;min-width:fit-content;padding-bottom:10px}
.rc{display:flex;flex-direction:column;gap:0;min-width:170px}
.rc+.rc{margin-left:14px}
.rh{text-align:center;font-size:10px;font-weight:700;color:#FFD700;padding:8px 10px;background:rgba(10,18,36,0.7);border-radius:8px 8px 0 0;border:1px solid rgba(40,60,90,0.4);border-bottom:none;text-transform:uppercase;letter-spacing:0.8px;position:sticky;top:0;z-index:2}
.rh span{display:block;font-size:8px;color:#556;font-weight:400;margin-top:1px}
.rc:last-child .rh{background:rgba(48,30,0,0.5);border-color:rgba(255,215,0,0.15)}
.rc:last-child .rh span{color:#A98200}
.ms{padding:0 6px;display:flex;flex-direction:column;justify-content:center;position:relative}
.ms::before{content:'';position:absolute;right:-12px;top:50%;width:10px;height:2px;background:rgba(40,60,90,0.2);z-index:1}
.ms::after{content:'';position:absolute;right:-12px;width:2px;background:rgba(40,60,90,0.12);z-index:1}
.ms:first-child::after{top:50%;bottom:0;height:50%}
.ms:last-child::after{top:0;bottom:50%;height:50%}
.ms:only-child::after{display:none}
.rc:first-child .ms::before,.rc:first-child .ms::after,.rc:last-child .ms::before,.rc:last-child .ms::after{display:none}
.mc{background:linear-gradient(160deg,rgba(20,32,56,0.88),rgba(12,20,38,0.92));border:1px solid rgba(40,60,90,0.35);border-radius:8px;padding:5px 6px;transition:.2s;position:relative}
.mc:hover{border-color:rgba(79,195,247,0.3);box-shadow:0 2px 12px rgba(0,0,0,0.2)}
.tb{display:flex;align-items:center;gap:4px;width:100%;padding:6px 8px;font-size:11px;font-family:'Inter',sans-serif;font-weight:600;text-align:left;border:1px solid rgba(40,60,90,0.4);border-radius:5px;background:rgba(10,18,36,0.5);color:#999;cursor:pointer;transition:all .12s;line-height:1.3}
.tb img{width:18px;height:13px;border-radius:2px;flex-shrink:0;border:1px solid rgba(40,60,90,0.2)}
.tb:hover:not(:disabled){background:rgba(26,46,76,0.8);border-color:#4FC3F7;color:#fff}
.tb.win{background:linear-gradient(135deg,rgba(26,80,26,0.7),rgba(30,96,30,0.5));border-color:rgba(76,175,80,0.5);color:#81C784;font-weight:700}
.tb:disabled{opacity:0.25;cursor:default}
.mv{text-align:center;font-size:8px;color:#334;padding:2px 0;letter-spacing:0.8px;font-weight:600}
#champion{text-align:center;max-width:1440px;margin:0 auto;padding:0 20px}
.cb{display:inline-flex;flex-direction:column;align-items:center;padding:20px 50px;margin:10px 0;background:linear-gradient(135deg,rgba(20,32,56,0.9),rgba(48,30,0,0.7));border:2px solid #FFD700;border-radius:14px;color:#FFD700;font-size:30px;font-weight:800;animation:pulse 2s ease-in-out infinite;letter-spacing:1px;box-shadow:0 0 50px rgba(255,215,0,0.08)}
.cb img{width:40px;height:30px;border-radius:4px;margin-bottom:6px;border:1px solid rgba(255,215,0,0.2)}
.cb small{font-size:13px;color:#A98200;font-weight:500;letter-spacing:1px;margin-top:3px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.01)}}
.ft{text-align:center;color:#2a3040;padding:25px;font-size:10px;border-top:1px solid rgba(26,42,69,0.3);margin-top:20px;letter-spacing:0.5px}
</style>
</head>
<body>
<div class="header"><h1>MUNDIAL 2026</h1><div class="sub"><span>Predictor</span> &middot; Resultados y bracket interactivo</div></div>
<div class="divider">&#9733; &#9733; &#9733;</div>
<section><div class="section-title">Fase de Grupos</div><div id="groups"></div></section>
<section><div class="section-title">Clasificados</div><div id="qualifiers"></div></section>
<section><div class="section-title">Bracket Eliminatorio</div><div class="br" id="bracket"></div></section>
<div id="champion"></div>
<div class="ft">Hac&eacute; clic en un equipo del bracket para que avance a la siguiente ronda</div>

<script>
var flagCodes = {
  "Mexico":"mx","Sudafrica":"za","Corea del Sur":"kr","Republica Checa":"cz",
  "Canada":"ca","Bosnia y Herz.":"ba","Qatar":"qa","Suiza":"ch",
  "Brasil":"br","Marruecos":"ma","Haiti":"ht","Escocia":"gb-sct",
  "EE.UU.":"us","Paraguay":"py","Australia":"au","Turquia":"tr",
  "Alemania":"de","Curazao":"cw","Costa de Marfil":"ci","Ecuador":"ec",
  "Paises Bajos":"nl","Japon":"jp","Suecia":"se","Tunez":"tn",
  "Belgica":"be","Egipto":"eg","Iran":"ir","N. Zelanda":"nz",
  "Espana":"es","Uruguay":"uy","Arabia Saudi":"sa","Cabo Verde":"cv",
  "Francia":"fr","Senegal":"sn","Irak":"iq","Noruega":"no",
  "Argentina":"ar","Argelia":"dz","Austria":"at","Jordania":"jo",
  "Portugal":"pt","RD Congo":"cd","Uzbekistan":"uz","Colombia":"co",
  "Inglaterra":"gb-eng","Croacia":"hr","Ghana":"gh","Panama":"pa"
};
var T = {
  A:["Mexico","Sudafrica","Corea del Sur","Republica Checa"],
  B:["Canada","Bosnia y Herz.","Qatar","Suiza"],
  C:["Brasil","Marruecos","Haiti","Escocia"],
  D:["EE.UU.","Paraguay","Australia","Turquia"],
  E:["Alemania","Curazao","Costa de Marfil","Ecuador"],
  F:["Paises Bajos","Japon","Suecia","Tunez"],
  G:["Belgica","Egipto","Iran","N. Zelanda"],
  H:["Espana","Uruguay","Arabia Saudi","Cabo Verde"],
  I:["Francia","Senegal","Irak","Noruega"],
  J:["Argentina","Argelia","Austria","Jordania"],
  K:["Portugal","RD Congo","Uzbekistan","Colombia"],
  L:["Inglaterra","Croacia","Ghana","Panama"]
};
function fl(n){return flagCodes[n]?'<img src="https://flagcdn.com/16x12/'+flagCodes[n]+'.png" alt="">':''}
function fi(n){return flagCodes[n]?'https://flagcdn.com/16x12/'+flagCodes[n]+'.png':''}
var md=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
var R={},BP={};
for(var g of "ABCDEFGHIJKL"){R[g]={};md.forEach(function(_,i){R[g][i]=''})}
for(var r=0;r<5;r++)BP[r]={};
function calc(g){
  var t=T[g],p={},gf={},ga={};
  t.forEach(function(n){p[n]=0;gf[n]=0;ga[n]=0});
  md.forEach(function(m,i){
    var r=R[g][i];
    if(r==='A'){p[t[m[0]]]+=3;gf[t[m[0]]]+=2}
    else if(r==='B'){p[t[m[1]]]+=3;gf[t[m[1]]]+=2}
    else if(r==='D'){p[t[m[0]]]+=1;p[t[m[1]]]+=1;gf[t[m[0]]]+=1;gf[t[m[1]]]+=1}
  });
  return t.map(function(n){return{name:n,pts:p[n],gd:gf[n]-ga[n],gf:gf[n]}}).sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf})
}
function th(){
  var t=[];
  for(var g of "ABCDEFGHIJKL"){var s=calc(g);if(s[2]){s[2].group=g;t.push(s[2])}}
  return t.sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf})
}
function rG(){
  var c=document.getElementById('groups');c.innerHTML='';
  for(var g of "ABCDEFGHIJKL"){
    var t=T[g],s=calc(g),card=document.createElement('div');card.className='grp';
    card.innerHTML='<h3>Grupo '+g+'</h3><div class="matches"></div>';
    var md2=card.querySelector('.matches');
    md.forEach(function(m,i){
      var sel=R[g][i]||'',d=document.createElement('div');d.className='mt';
      d.innerHTML='<span class="tn">'+fl(t[m[0]])+' '+t[m[0]]+'</span>'+
        '<select data-g="'+g+'" data-m="'+i+'"><option value="">Elegir...</option>'+
        '<option value="A" '+(sel==='A'?'selected':'')+'>'+fl(t[m[0]])+' '+t[m[0]]+' gana</option>'+
        '<option value="D" '+(sel==='D'?'selected':'')+'>Empate</option>'+
        '<option value="B" '+(sel==='B'?'selected':'')+'>'+fl(t[m[1]])+' '+t[m[1]]+' gana</option></select>'+
        '<span class="tn">'+fl(t[m[1]])+' '+t[m[1]]+'</span>';
      md2.appendChild(d);
    });
    var h='<table class="st"><tr><th>#</th><th>Equipo</th><th>Pts</th></tr>';
    s.forEach(function(x,i){
      h+='<tr class="'+(i<2?'q':i===2?'t':'')+'"><td>'+(i+1)+'</td><td>'+fl(x.name)+' '+x.name+'</td><td><span class="pts">'+x.pts+'</span></td></tr>'
    });
    h+='</table>';
    card.innerHTML+=h;c.appendChild(card);
  }
}
function rQ(){
  var d=document.getElementById('qualifiers');
  var h='<div class="qg">';
  for(var g of "ABCDEFGHIJKL"){var s=calc(g);
    h+='<div class="qi"><strong>'+g+'</strong> <span class="q1">'+fl(s[0]?.name||'')+' '+(s[0]?.name||'-')+'</span> <span class="q2">'+fl(s[1]?.name||'')+' '+(s[1]?.name||'-')+'</span></div>'}
  h+='</div>';
  var t=th();
  h+='<div class="ts"><h4>Mejores terceros (pasan 8)</h4><div class="tg">';
  t.forEach(function(x,i){h+='<span class="tc '+(i<8?'ti':'to')+'">'+fl(x.name)+' '+x.name+' ('+x.group+') '+x.pts+'pts</span>'});
  h+='</div></div>';d.innerHTML=h;
}
function rB(){
  var f={},s2={};
  for(var g of "ABCDEFGHIJKL"){var st=calc(g);if(st[0])f[g]=st[0].name;if(st[1])s2[g]=st[1].name}
  var t3=th().slice(0,8).map(function(t){return t.name});
  var r32=[
    [f.A||'-',s2.B||'-'],[f.C||'-',s2.D||'-'],[f.E||'-',s2.F||'-'],[f.G||'-',s2.H||'-'],
    [f.I||'-',s2.J||'-'],[f.K||'-',s2.L||'-'],[f.B||'-',s2.A||'-'],[f.D||'-',s2.C||'-'],
    [f.F||'-',s2.E||'-'],[f.H||'-',s2.G||'-'],[f.J||'-',s2.I||'-'],[f.L||'-',s2.K||'-'],
    [t3[0]||'-',t3[1]||'-'],[t3[2]||'-',t3[3]||'-'],[t3[4]||'-',t3[5]||'-'],[t3[6]||'-',t3[7]||'-']
  ];
  var nn=[{l:'Dieciseisavos',s:'R32'},{l:'Octavos',s:'R16'},{l:'Cuartos',s:'QF'},{l:'Semifinales',s:'SF'},{l:'FINAL',s:'MetLife'}];
  var al=[r32];
  for(var r=0;r<4;r++){var p=al[r],nx=[];for(var i=0;i<p.length;i+=2){var a=BP[r]?.[i],b=BP[r]?.[i+1];nx.push([a||'-',b||'-'])};al.push(nx)}
  var U=48;
  var dv=document.getElementById('bracket');dv.innerHTML='';var fl2=document.createElement('div');fl2.className='bf';
  al.forEach(function(rd,r){
    var co=document.createElement('div');co.className='rc';
    var hd=document.createElement('div');hd.className='rh';hd.innerHTML=nn[r].l+'<span>'+nn[r].s+'</span>';co.appendChild(hd);
    var sc=Math.pow(2,r),gp=r===0?5:sc*3;
    rd.forEach(function(m,mi){
      var sl=document.createElement('div');sl.className='ms';
      if(r===0)sl.style.minHeight=U+'px';else sl.style.minHeight=(U*sc-2)+'px';
      sl.style.paddingTop=r===0&&mi===0?'0':(gp/2)+'px';
      sl.style.paddingBottom=mi<rd.length-1?(gp/2)+'px':'0';
      var pk=BP[r]?.[mi];
      var mc2=document.createElement('div');mc2.className='mc';
      [0,1].forEach(function(sd){
        var tm=m[sd],iw=pk===tm,td=tm==='-';
        if(sd===1){var vs=document.createElement('div');vs.className='mv';vs.textContent='VS';mc2.appendChild(vs)}
        var btn=document.createElement('button');btn.className='tb'+(iw?' win':'');
        var fUrl=fi(tm);
        btn.innerHTML=(fUrl?'<img src="'+fUrl+'" alt="">':'')+' '+tm;
        btn.dataset.r=r;btn.dataset.m=mi;btn.dataset.side=sd;
        if(td)btn.disabled=true;
        mc2.appendChild(btn);
      });
      sl.appendChild(mc2);co.appendChild(sl);
    });
    fl2.appendChild(co);
  });
  dv.appendChild(fl2);
  var fp=BP[4]?.[0],fUrl2=fi(fp);
  document.getElementById('champion').innerHTML=fp&&fp!=='-'
    ?'<div class="cb">'+(fUrl2?'<img src="'+fUrl2+'" alt="">':'')+' '+fp+'<small>Campeon del Mundo 2026</small></div>':'';
  document.querySelectorAll('.tb:not(:disabled)').forEach(function(btn){
    btn.addEventListener('click',function(){
      var r=parseInt(this.dataset.r),m=parseInt(this.dataset.m),sd=parseInt(this.dataset.side);
      var tm=al[r][m][sd];if(tm==='-')return;
      BP[r][m]=tm;
      for(var rr=r+1;rr<5;rr++){var fa=Math.pow(2,rr-r),sm=Math.floor(m/fa)*(fa/2),em=sm+fa/2;for(var k in BP[rr]){if(parseInt(k)>=sm&&parseInt(k)<em)delete BP[rr][k]}}
      rB();
    })
  });
}
document.addEventListener('change',function(e){if(e.target.matches('.mt select')){R[e.target.dataset.g][parseInt(e.target.dataset.m)]=e.target.value;BP={};for(var r=0;r<5;r++)BP[r]={};rG();rQ();rB()}});
rG();rQ();rB();
</script>
</body>
</html>
