<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 - Predictor y Apuestas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter','Segoe UI',Arial,sans-serif;
  min-height:100vh;
  background:#0a0f1e;color:#e0e0e0;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(26,60,40,0.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(26,40,60,0.3) 0%,transparent 50%);
}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.05) 0%,transparent 50%),radial-gradient(1px 1px at 50% 70%,rgba(255,255,255,0.05) 0%,transparent 50%),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,0.04) 0%,transparent 50%);background-size:200px 200px}
.header{text-align:center;padding:20px 20px 4px}
.header h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#FFD700,#FF8C00,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px}
.header .sub{color:#667;font-size:12px;margin-top:2px}
.header .sub span{color:#FFD700}
.tabs{display:flex;justify-content:center;gap:6px;margin:10px auto 0;max-width:500px}
.tab{padding:7px 18px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(40,60,90,0.4);background:rgba(10,18,36,0.6);color:#667;transition:.15s;font-family:'Inter',sans-serif}
.tab:hover{color:#bbb;border-color:rgba(79,195,247,0.3)}
.tab.act{background:rgba(255,215,0,0.12);border-color:#FFD700;color:#FFD700}
.psel{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px auto 0;max-width:500px;flex-wrap:wrap}
.psel label{font-size:11px;color:#667}
.psel select{padding:5px 12px;font-size:12px;font-family:'Inter',sans-serif;border:1px solid rgba(40,60,90,0.5);border-radius:6px;background:rgba(10,18,36,0.8);color:#e0e0e0;cursor:pointer;outline:none}
.psel select:focus{border-color:#4FC3F7}
.psel .save{font-size:10px;color:#4CAF50;display:none}
.divider{text-align:center;padding:6px 0;font-size:18px;color:rgba(255,215,0,0.12);letter-spacing:6px}
section{max-width:1440px;margin:0 auto 20px;padding:0 16px}
.section-title{font-size:16px;font-weight:700;color:#FFD700;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid rgba(255,215,0,0.1);display:flex;align-items:center;gap:8px}
.section-title .sc{font-size:10px;color:#556;font-weight:400;margin-left:auto}
#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.grp{background:linear-gradient(160deg,rgba(20,32,56,0.92),rgba(12,20,38,0.95));border-radius:10px;padding:12px;border:1px solid rgba(40,60,90,0.4)}
.grp h3{font-size:12px;color:#90CAF9;margin-bottom:6px}
.matches{display:flex;flex-direction:column;gap:3px}
.mt{display:flex;align-items:center;gap:4px;padding:2px 0}
.mt .tn{font-size:10px;min-width:68px;display:flex;align-items:center;gap:3px}
.mt .tn:first-child{text-align:right;justify-content:flex-end}
.mt .tn:last-child{text-align:left}
.mt .tn img{width:14px;height:10px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.1)}
.mt .sc2{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.mt .sc2 input{width:36px;padding:4px 2px;font-size:11px;font-family:'Inter',sans-serif;text-align:center;border:1px solid rgba(40,60,90,0.4);border-radius:4px;background:rgba(10,18,36,0.8);color:#e0e0e0;outline:none;font-weight:600}
.mt .sc2 input:focus{border-color:#4FC3F7}
.mt .sc2 input.g{background:rgba(76,175,80,0.1);border-color:rgba(76,175,80,0.3);color:#81C784}
.mt .sc2 input.e{background:rgba(255,213,79,0.08);border-color:rgba(255,213,79,0.2);color:#FFD54F}
.mt .sc2 input.p{background:rgba(244,67,54,0.08);border-color:rgba(244,67,54,0.2);color:#EF5350}
.mt .sc2 .sp{color:#445;font-size:11px;font-weight:700}
.st{width:100%;border-collapse:collapse;margin-top:6px;font-size:10px;border-radius:5px;overflow:hidden}
.st th{background:rgba(10,18,36,0.6);color:#90CAF9;padding:4px 3px;text-align:center;font-size:8px;text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid rgba(40,60,90,0.3)}
.st td{padding:4px 3px;text-align:center;border-bottom:1px solid rgba(20,32,56,0.4);font-size:10px;vertical-align:middle}
.st .col-pos{width:20px;color:#445;font-weight:600;text-align:center}
.st .col-team{text-align:left;padding-left:6px;font-weight:600}
.st .col-team img{width:16px;height:11px;border-radius:2px;vertical-align:middle;margin-right:4px;border:1px solid rgba(255,255,255,0.08)}
.st .col-pts{text-align:center}
.st tr.q{background:rgba(76,175,80,0.06)}
.st tr.q td{color:#81C784}
.st tr.t{background:rgba(255,213,79,0.04)}
.st tr.t td{color:#FFD54F}
.pts{display:inline-block;background:rgba(10,18,36,0.9);color:#FFD700;border-radius:8px;padding:2px 8px;font-weight:700;font-size:12px;border:1px solid rgba(255,215,0,0.2);min-width:30px;text-align:center}
#qualifiers{background:linear-gradient(160deg,rgba(20,32,56,0.85),rgba(12,20,38,0.9));border-radius:10px;padding:14px;border:1px solid rgba(40,60,90,0.35)}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:3px;margin:4px 0}
.qi{padding:4px 8px;border-radius:5px;font-size:10px;background:rgba(10,18,36,0.3);display:flex;align-items:center;gap:6px}
.qi img{width:14px;height:10px;border-radius:2px;border:1px solid rgba(255,255,255,0.05)}
.qi strong{color:#90CAF9;margin-right:3px}
.q1{color:#81C784;font-weight:600}
.q2{color:#64B5F6;font-weight:600}
.ts{margin-top:8px;padding-top:8px;border-top:1px solid rgba(40,60,90,0.2)}
.ts h4{color:#90CAF9;font-size:10px;margin-bottom:5px;font-weight:500}
.tg{display:flex;flex-wrap:wrap;gap:3px}
.tc{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:9px;font-weight:500}
.tc img{width:13px;height:9px;border-radius:2px;border:1px solid rgba(255,255,255,0.05)}
.ti{background:rgba(76,175,80,0.12);color:#81C784;border:1px solid rgba(42,90,42,0.4)}
.to{background:rgba(244,67,54,0.07);color:#EF5350;border:1px solid rgba(74,26,26,0.25);text-decoration:line-through;opacity:0.4}
.br{overflow-x:auto;padding:4px 0 16px;display:flex;justify-content:center}
.bf{display:flex;gap:0;min-width:fit-content;padding:10px 20px 20px;background:rgba(10,18,36,0.3);border-radius:10px;margin:0 auto}
.rc{display:flex;flex-direction:column;position:relative}
.rc+.rc{margin-left:0}
.rc::after{content:'';position:absolute;right:-6px;top:0;bottom:0;width:6px}
.rh{text-align:center;font-size:8px;font-weight:700;color:#FFD700;padding:4px 8px;background:rgba(10,18,36,0.7);border-radius:4px;margin-bottom:4px;letter-spacing:0.5px;white-space:nowrap}
.rh span{display:block;font-size:7px;color:#556;font-weight:400}
.rc:last-child .rh{background:rgba(48,20,0,0.6);color:#FFD700}
.ms{padding:0;display:flex;flex-direction:column;justify-content:center;position:relative;padding-left:10px}
.rc .ms::before{content:'';position:absolute;left:0;top:50%;width:8px;height:2px;background:rgba(255,215,0,0.15)}
.mc{background:linear-gradient(160deg,rgba(20,32,56,0.88),rgba(12,20,38,0.92));border:1px solid rgba(40,60,90,0.35);border-radius:5px;padding:2px 3px;transition:.15s}
.mc:hover{border-color:rgba(79,195,247,0.3)}
.tb{display:flex;align-items:center;gap:3px;width:100%;padding:4px 5px;font-size:9px;font-family:'Inter',sans-serif;font-weight:600;text-align:left;border:1px solid rgba(40,60,90,0.4);border-radius:3px;background:rgba(10,18,36,0.5);color:#999;cursor:pointer;transition:all .1s;line-height:1.2;min-width:95px}
.tb img{width:14px;height:10px;border-radius:2px;flex-shrink:0;border:1px solid rgba(40,60,90,0.2)}
.tb:hover:not(:disabled){background:rgba(26,46,76,0.8);border-color:#4FC3F7;color:#fff}
.tb.win{background:linear-gradient(135deg,rgba(32,90,32,0.7),rgba(40,100,40,0.5));border-color:rgba(76,175,80,0.5);color:#81C784;font-weight:700}
.tb:disabled{opacity:0.25;cursor:default}
.mv{text-align:center;font-size:6px;color:#445;padding:1px 0;font-weight:600;letter-spacing:0.5px}
#champion{text-align:center;max-width:1440px;margin:0 auto;padding:0 16px}
.cb{display:inline-flex;flex-direction:column;align-items:center;padding:16px 40px;margin:8px 0;background:linear-gradient(135deg,rgba(20,32,56,0.9),rgba(48,30,0,0.7));border:2px solid #FFD700;border-radius:12px;color:#FFD700;font-size:26px;font-weight:800;animation:pulse 2s ease-in-out infinite;letter-spacing:1px;box-shadow:0 0 50px rgba(255,215,0,0.08)}
.cb img{width:36px;height:26px;border-radius:4px;margin-bottom:4px;border:1px solid rgba(255,215,0,0.2)}
.cb small{font-size:12px;color:#A98200;font-weight:500;letter-spacing:1px;margin-top:2px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.01)}}
.ft{text-align:center;color:#2a3040;padding:20px;font-size:10px;border-top:1px solid rgba(26,42,69,0.3);margin-top:16px;letter-spacing:0.5px}
/* Apuestas UI */
.pred-grid{overflow-x:auto}
.pred-grid table{width:100%;border-collapse:collapse;font-size:10px}
.pred-grid th{background:rgba(10,18,36,0.6);color:#90CAF9;padding:6px 4px;text-align:center;font-size:8px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(40,60,90,0.3);position:sticky;top:0;z-index:2}
.pred-grid td{padding:4px 3px;border-bottom:1px solid rgba(20,32,56,0.3);vertical-align:middle;text-align:center}
.pred-grid td.tn{text-align:left;white-space:nowrap}
.pred-grid td.tn img{width:14px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle;border:1px solid rgba(255,255,255,0.08)}
input.sc{width:34px;padding:4px 2px;font-size:11px;font-family:'Inter',sans-serif;text-align:center;border:1px solid rgba(40,60,90,0.4);border-radius:4px;background:rgba(10,18,36,0.8);color:#e0e0e0;outline:none;font-weight:600}
input.sc:focus{border-color:#4FC3F7}
input.sc.gl{background:rgba(76,175,80,0.1);border-color:rgba(76,175,80,0.3);color:#81C784}
input.sc.ge{background:rgba(255,213,79,0.08);border-color:rgba(255,213,79,0.2);color:#FFD54F}
input.sc.gv{background:rgba(244,67,54,0.08);border-color:rgba(244,67,54,0.2);color:#EF5350}
.pred-grid td.sct{display:flex;align-items:center;gap:2px;justify-content:center}
.sec-h{font-size:12px;font-weight:700;color:#90CAF9;background:rgba(10,18,36,0.4);padding:6px 8px!important;text-align:left!important}
.sec-h td{color:#90CAF9;font-weight:700;font-size:10px;padding:6px 8px!important}
.camp{display:inline-block;margin:4px 0;padding:8px 16px;background:rgba(255,215,0,0.08);border:1px dashed rgba(255,215,0,0.2);border-radius:8px;font-size:10px;color:#FFD700}
.camp img{width:18px;height:13px;border-radius:2px;margin-right:4px;vertical-align:middle}
span.gl{background:rgba(76,175,80,0.12);color:#81C784;border:1px solid rgba(76,175,80,0.2)}
span.ge{background:rgba(255,213,79,0.08);color:#FFD54F;border:1px solid rgba(255,213,79,0.15)}
span.gv{background:rgba(244,67,54,0.07);color:#EF5350;border:1px solid rgba(244,67,54,0.15)}
.sum-pts{font-size:18px;font-weight:800;color:#FFD700;text-align:center;padding:10px}
.act{display:none}
.act.show{display:block}
.tab-c{display:none}
.tab-c.show{display:block}
</style>
</head>
<body>
<div class="header"><h1>MUNDIAL 2026</h1><div class="sub"><span>Predictor + Apuestas</span></div></div>
<div class="tabs" id="tabBar">
  <button class="tab act" data-tab="resultados">Resultados</button>
  <button class="tab" data-tab="apuestas">Mis Apuestas</button>
  <button class="tab" data-tab="comparar">Comparar</button>
</div>
<div class="psel" id="personaSel" style="display:none">
  <label>Quien sos?</label>
  <select id="persona"><option value="">Seleccionar...</option></select>
  <span class="save" id="saveMsg">Guardado!</span>
</div>
<div class="divider">&#9733; &#9733; &#9733;</div>

<div id="tabResultados" class="tab-c show">
  <section><div class="section-title">Fase de Grupos</div><div id="groups"></div></section>
  <section><div class="section-title">Clasificados</div><div id="qualifiers"></div></section>
  <section><div class="section-title">Bracket Eliminatorio</div><div class="br" id="bracket"></div></section>
  <div id="champion"></div>
</div>

<div id="tabApuestas" class="tab-c">
  <section>
    <div class="section-title">Tus predicciones <span class="sc">para cada partido</span></div>
    <div id="apuestasCont" class="pred-grid"></div>
  </section>
</div>

<div id="tabComparar" class="tab-c">
  <section>
    <div class="section-title">Todas las apuestas</div>

  </section>
</div>

<div class="ft">Eleg&iacute; qui&eacute;n sos, hac&eacute; tus predicciones y compart&iacute; el link!</div>

<script>
var C = {
  "Mexico":"mx","Sudafrica":"za","Corea del Sur":"kr","Republica Checa":"cz",
  "Canada":"ca","Bosnia y Herz.":"ba","Qatar":"qa","Suiza":"ch",
  "Brasil":"br","Marruecos":"ma","Haiti":"ht","Escocia":"gb-sct",
  "EE.UU.":"us","Paraguay":"py","Australia":"au","Turquia":"tr",
  "Alemania":"de","Curazao":"cw","Costa de Marfil":"ci","Ecuador":"ec",
  "Paises Bajos":"nl","Japon":"jp","Suecia":"se","Tunez":"tn",
  "Belgica":"be","Egipto":"eg","Iran":"ir","N. Zelanda":"nz",
  "Espana":"es","Uruguay":"uy","Arabia Saudi":"sa","Cabo Verde":"cv",
  "Francia":"fr","Senegal":"sn","Irak":"iq","Noruega":"no",
  "Argentina":"ar","Argelia":"dz","Austria":"at","Jordania":"jo",
  "Portugal":"pt","RD Congo":"cd","Uzbekistan":"uz","Colombia":"co",
  "Inglaterra":"gb-eng","Croacia":"hr","Ghana":"gh","Panama":"pa"
};
var N = {
  "Mexico":"M\u00e9xico","Sudafrica":"Sud\u00e1frica","Corea del Sur":"Corea del Sur","Republica Checa":"Rep\u00fablica Checa",
  "Canada":"Canad\u00e1","Bosnia y Herz.":"Bosnia y Herz.","Qatar":"Qatar","Suiza":"Suiza",
  "Brasil":"Brasil","Marruecos":"Marruecos","Haiti":"Hait\u00ed","Escocia":"Escocia",
  "EE.UU.":"EE.UU.","Paraguay":"Paraguay","Australia":"Australia","Turquia":"Turqu\u00eda",
  "Alemania":"Alemania","Curazao":"Curazao","Costa de Marfil":"Costa de Marfil","Ecuador":"Ecuador",
  "Paises Bajos":"Pa\u00edses Bajos","Japon":"Jap\u00f3n","Suecia":"Suecia","Tunez":"T\u00fanez",
  "Belgica":"B\u00e9lgica","Egipto":"Egipto","Iran":"Ir\u00e1n","N. Zelanda":"N. Zelanda",
  "Espana":"Espa\u00f1a","Uruguay":"Uruguay","Arabia Saudi":"Arabia Saud\u00ed","Cabo Verde":"Cabo Verde",
  "Francia":"Francia","Senegal":"Senegal","Irak":"Irak","Noruega":"Noruega",
  "Argentina":"Argentina","Argelia":"Argelia","Austria":"Austria","Jordania":"Jordania",
  "Portugal":"Portugal","RD Congo":"RD Congo","Uzbekistan":"Uzbekist\u00e1n","Colombia":"Colombia",
  "Inglaterra":"Inglaterra","Croacia":"Croacia","Ghana":"Ghana","Panama":"Panam\u00e1"
};
var PEOPLE = ["Lucia","Ed","Euge","Kevin","Cami","Abraham","Esteban","Pedro","Rocio C.","Rocio V","Esteban 2"];
var T = {
  A:["Mexico","Sudafrica","Corea del Sur","Republica Checa"],
  B:["Canada","Bosnia y Herz.","Qatar","Suiza"],
  C:["Brasil","Marruecos","Haiti","Escocia"],
  D:["EE.UU.","Paraguay","Australia","Turquia"],
  E:["Alemania","Curazao","Costa de Marfil","Ecuador"],
  F:["Paises Bajos","Japon","Suecia","Tunez"],
  G:["Belgica","Egipto","Iran","N. Zelanda"],
  H:["Espana","Uruguay","Arabia Saudi","Cabo Verde"],
  I:["Francia","Senegal","Irak","Noruega"],
  J:["Argentina","Argelia","Austria","Jordania"],
  K:["Portugal","RD Congo","Uzbekistan","Colombia"],
  L:["Inglaterra","Croacia","Ghana","Panama"]
};
function dn(n){return N[n]||n}
function fl(n){return C[n]?'<img src="https://flagcdn.com/16x12/'+C[n]+'.png" alt="">':''}
function fl24(n){return C[n]?'<img src="https://flagcdn.com/24x18/'+C[n]+'.png" alt="">':''}
var md=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
var R={},BP={};
for(var g of "ABCDEFGHIJKL"){R[g]={};md.forEach(function(_,i){R[g][i]=''})}
for(var r=0;r<5;r++)BP[r]={};

var ALL_MATCHES=[];
(function(){
  for(var g of "ABCDEFGHIJKL"){
    md.forEach(function(m,i){
      ALL_MATCHES.push({g:g,j:i+1,l:T[g][m[0]],v:T[g][m[1]]});
    });
  }
})();

function calc(g){
  var t=T[g],p={},gf={},ga={};
  t.forEach(function(n){p[n]=0;gf[n]=0;ga[n]=0});
  md.forEach(function(m,i){
    var r=R[g][i];
    if(r==='A'){p[t[m[0]]]+=3;gf[t[m[0]]]+=2}
    else if(r==='B'){p[t[m[1]]]+=3;gf[t[m[1]]]+=2}
    else if(r==='D'){p[t[m[0]]]+=1;p[t[m[1]]]+=1;gf[t[m[0]]]+=1;gf[t[m[1]]]+=1}
  });
  return t.map(function(n){return{
    name:n,dn:dn(n),pts:p[n],gd:gf[n]-ga[n],gf:gf[n]
  }}).sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf})
}
function th(){
  var t=[];
  for(var g of "ABCDEFGHIJKL"){var s=calc(g);if(s[2]){s[2].group=g;t.push(s[2])}}
  return t.sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf})
}
function rG(){
  var c=document.getElementById('groups');c.innerHTML='';
  for(var g of "ABCDEFGHIJKL"){
    var t=T[g],s=calc(g),card=document.createElement('div');card.className='grp';
    card.innerHTML='<h3>Grupo '+g+'</h3><div class="matches"></div>';
    var md2=card.querySelector('.matches');
    md.forEach(function(m,i){
      var sel=R[g][i]||'',gl='',gv='',clsL='',clsV='';
      if(sel==='A'){gl='1';gv='0';clsL='g';clsV='p'}
      else if(sel==='D'){gl='0';gv='0';clsL='e';clsV='e'}
      else if(sel==='B'){gl='0';gv='1';clsL='p';clsV='g'}
      var d=document.createElement('div');d.className='mt';
      d.innerHTML='<span class="tn">'+fl(t[m[0]])+' '+dn(t[m[0]])+'</span>'+
        '<div class="sc2"><input type="number" min="0" max="20" class="sg '+clsL+'" data-g="'+g+'" data-m="'+i+'" data-side="l" value="'+gl+'"><span class="sp">-</span><input type="number" min="0" max="20" class="sg '+clsV+'" data-g="'+g+'" data-m="'+i+'" data-side="v" value="'+gv+'"></div>'+
        '<span class="tn">'+fl(t[m[1]])+' '+dn(t[m[1]])+'</span>';
      md2.appendChild(d);
    });
    var h='<table class="st"><tr><th>#</th><th>Equipo</th><th>Pts</th></tr>';
    s.forEach(function(x,i){
      var cls=i<2?'q':i===2?'t':'';
      h+='<tr class="'+cls+'"><td class="col-pos">'+(i+1)+'</td>'+
        '<td class="col-team">'+fl(x.name)+' '+x.dn+'</td>'+
        '<td class="col-pts"><span class="pts">'+x.pts+'</span></td></tr>';
    });
    h+='</table>';
    card.innerHTML+=h;c.appendChild(card);
  }
}
function rQ(){
  var d=document.getElementById('qualifiers');
  var h='<div class="qg">';
  for(var g of "ABCDEFGHIJKL"){var s=calc(g);
    h+='<div class="qi"><strong>'+g+'</strong> <span class="q1">'+fl(s[0]?.name||'')+' '+(s[0]?dn(s[0].name):'-')+'</span> <span class="q2">'+fl(s[1]?.name||'')+' '+(s[1]?dn(s[1].name):'-')+'</span></div>'}
  h+='</div>';
  var t=th();
  h+='<div class="ts"><h4>Mejores terceros (pasan 8)</h4><div class="tg">';
  t.forEach(function(x,i){h+='<span class="tc '+(i<8?'ti':'to')+'">'+fl(x.name)+' '+x.dn+' ('+x.group+') '+x.pts+'pts</span>'});
  h+='</div></div>';d.innerHTML=h;
}
function rB(){
  var f={},s2={};
  for(var g of "ABCDEFGHIJKL"){var st=calc(g);if(st[0])f[g]=st[0].name;if(st[1])s2[g]=st[1].name}
  var t3=th().slice(0,8).map(function(t){return t.name});
  var r32=[
    [f.A||'-',s2.B||'-'],[f.C||'-',s2.D||'-'],[f.E||'-',s2.F||'-'],[f.G||'-',s2.H||'-'],
    [f.I||'-',s2.J||'-'],[f.K||'-',s2.L||'-'],[f.B||'-',s2.A||'-'],[f.D||'-',s2.C||'-'],
    [f.F||'-',s2.E||'-'],[f.H||'-',s2.G||'-'],[f.J||'-',s2.I||'-'],[f.L||'-',s2.K||'-'],
    [t3[0]||'-',t3[1]||'-'],[t3[2]||'-',t3[3]||'-'],[t3[4]||'-',t3[5]||'-'],[t3[6]||'-',t3[7]||'-']
  ];
  var nn=[{l:'R32',s:'16vos'},{l:'R16',s:'8vos'},{l:'QF',s:'4tos'},{l:'SF',s:'Semis'},{l:'FINAL',s:''}];
  var al=[r32];
  for(var r=0;r<4;r++){var p=al[r],nx=[];for(var i=0;i<p.length;i+=2){var a=BP[r]?.[i],b=BP[r]?.[i+1];nx.push([a||'-',b||'-'])};al.push(nx)}
  var H=[60,60,64,60,60]; // heights per round column
  var dv=document.getElementById('bracket');dv.innerHTML='';
  var wrap=document.createElement('div');wrap.className='bf';
  al.forEach(function(rd,r){
    var col=document.createElement('div');col.className='rc';col.style.minWidth=r===4?'110px':'95px';
    var hd=document.createElement('div');hd.className='rh';hd.innerHTML=nn[r].l+(nn[r].s?' <span>'+nn[r].s+'</span>':'');col.appendChild(hd);
    var total=rd.length;
    rd.forEach(function(m,mi){
      var sl=document.createElement('div');sl.className='ms';sl.style.minHeight=H[r]+'px';
      if(mi>0)sl.style.marginTop='4px';
      var pk=BP[r]?.[mi];
      var mc2=document.createElement('div');mc2.className='mc';
      [0,1].forEach(function(sd){
        var tm=m[sd],iw=pk===tm,td=tm==='-';
        if(sd===1){var vs=document.createElement('div');vs.className='mv';vs.textContent='VS';mc2.appendChild(vs)}
        var btn=document.createElement('button');btn.className='tb'+(iw?' win':'');
        btn.innerHTML=fl(tm)+' '+(C[tm]?dn(tm):tm);
        btn.dataset.r=r;btn.dataset.m=mi;btn.dataset.side=sd;btn.title=tm;
        if(td)btn.disabled=true;
        mc2.appendChild(btn);
      });
      sl.appendChild(mc2);col.appendChild(sl);
    });
    wrap.appendChild(col);
  });
  dv.appendChild(wrap);
  var fp=BP[4]?.[0];
  document.getElementById('champion').innerHTML=fp&&fp!=='-'
    ?'<div class="cb">'+fl24(fp)+'<span>'+(C[fp]?dn(fp):fp)+'</span><small>Campe\u00f3n del Mundo 2026</small></div>':'';
  document.querySelectorAll('.tb:not(:disabled)').forEach(function(btn){
    btn.addEventListener('click',function(){
      var r=parseInt(this.dataset.r),m=parseInt(this.dataset.m),sd=parseInt(this.dataset.side);
      var tm=al[r][m][sd];if(tm==='-')return;
      BP[r][m]=tm;
      for(var rr=r+1;rr<5;rr++){var fa=Math.pow(2,rr-r),sm=Math.floor(m/fa)*(fa/2),em=sm+fa/2;for(var k in BP[rr]){if(parseInt(k)>=sm&&parseInt(k)<em)delete BP[rr][k]}}
      rB();
    })
  });
}
document.addEventListener('input',function(e){
  if(e.target.matches('.sg')){
    var g=e.target.dataset.g,m=parseInt(e.target.dataset.m);
    var l=document.querySelector('.sg[data-g="'+g+'"][data-m="'+m+'"][data-side="l"]');
    var v=document.querySelector('.sg[data-g="'+g+'"][data-m="'+m+'"][data-side="v"]');
    var lg=parseInt(l.value)||0,vg=parseInt(v.value)||0;
    var res='';
    if(l.value!==''&&v.value!==''){res=lg>vg?'A':lg<vg?'B':'D'}
    R[g][m]=res;
    // Color the inputs
    [l,v].forEach(function(x){x.className='sg'});
    if(res==='A'){l.classList.add('g');v.classList.add('p')}
    else if(res==='D'){l.classList.add('e');v.classList.add('e')}
    else if(res==='B'){l.classList.add('p');v.classList.add('g')}
    BP={};for(var r=0;r<5;r++)BP[r]={};rG();rQ();rB()
  }
});

// =============================================
// APUESTAS SYSTEM
// =============================================
var AP = {}; // {personName: {matchIdx: 'L'|'E'|'V'}}

function getAP(){try{var d=localStorage.getItem('m26ap');if(d){AP=JSON.parse(d)}else{AP={}}}catch(e){}}
function saveAP(){try{localStorage.setItem('m26ap',JSON.stringify(AP))}catch(e){}}

function initPersonaSel(){
  var sel=document.getElementById('persona');
  sel.innerHTML='<option value="">Seleccionar...</option>';
  PEOPLE.forEach(function(p){
    var o=document.createElement('option');o.value=p;o.textContent=p;
    if(localStorage.getItem('m26_last')===p)o.selected=true;
    sel.appendChild(o);
  });
  if(localStorage.getItem('m26_last')){loadPersona(localStorage.getItem('m26_last'))}
}

function loadPersona(name){
  getAP();
  if(!name){document.getElementById('apuestasCont').innerHTML='<div style="text-align:center;padding:20px;color:#556;font-size:12px">Seleccion\u00e1 qui\u00e9n sos para hacer tus predicciones</div>';return}
  localStorage.setItem('m26_last',name);
  var preds=AP[name]||{};
  var h='<table><tr><th>#</th><th>Grupo</th><th colspan="2">Local</th><th colspan="2">Visitante</th><th>Resultado</th></tr>';
  ALL_MATCHES.forEach(function(m,mi){
    if(mi>0&&mi%6===0)h+='<tr class="sec-h"><td colspan="7" style="padding:6px 8px;color:#90CAF9;font-weight:700;font-size:10px">Grupo '+m.g+'</td></tr>';
    var sc=(preds[mi]||'').split('-'),gl=sc.length===2?sc[0]:'',gv=sc.length===2?sc[1]:'';
    h+='<tr><td>'+(mi+1)+'</td><td>'+m.g+'</td><td class="tn" style="text-align:right">'+dn(m.l)+' '+fl(m.l)+'</td><td style="width:40px"><input type="number" min="0" max="20" class="sc" data-idx="'+mi+'" data-side="l" value="'+gl+'"></td><td style="width:40px"><input type="number" min="0" max="20" class="sc" data-idx="'+mi+'" data-side="v" value="'+gv+'"></td><td class="tn">'+fl(m.v)+' '+dn(m.v)+'</td><td class="res" data-idx="'+mi+'" style="font-size:11px;font-weight:700;text-align:center" id="res'+mi+'">'+(gl!==''&&gv!==''?gl+'-'+gv:'-')+'</td></tr>';
  });
  h+='</table>';
  document.getElementById('apuestasCont').innerHTML=h;
  document.querySelectorAll('#apuestasCont input.sc').forEach(function(inp){
    inp.addEventListener('input',function(){
      var idx=parseInt(this.dataset.idx),name2=document.getElementById('persona').value;
      if(!name2)return;
      var l=document.querySelector('input.sc[data-idx="'+idx+'"][data-side="l"]'),v=document.querySelector('input.sc[data-idx="'+idx+'"][data-side="v"]');
      var lg=l.value,vv=v.value,score='';
      if(lg!==''&&vv!=='')score=lg+'-'+vv;
      getAP();if(!AP[name2])AP[name2]={};AP[name2][idx]=score;saveAP();
      var resEl=document.getElementById('res'+idx);
      resEl.textContent=score||'-';
      if(score){
        var a=parseInt(lg),b=parseInt(vv);
        l.className='sc'+(a>b?' gl':a===b?' ge':' gv');
        v.className='sc'+(a>b?' gv':a===b?' ge':' gl');
        if(a>b){resEl.style.color='#81C784'}else if(a<b){resEl.style.color='#EF5350'}else{resEl.style.color='#FFD54F'}
      }else{l.className='sc';v.className='sc';resEl.style.color='#667'}
      document.getElementById('saveMsg').style.display='inline';
      var sm=document.getElementById('saveMsg');clearTimeout(sm._t);sm._t=setTimeout(function(){sm.style.display='none'},2000);
    });
  });
}

function rComparar(){
  getAP();
  var h='<div style="overflow-x:auto"><table><tr><th>#</th><th>Partido</th>';
  PEOPLE.forEach(function(p){h+='<th style="font-size:9px;padding:4px 6px;height:60px;writing-mode:vertical-lr;text-orientation:mixed">'+p+'</th>'});
  h+='</tr>';
  ALL_MATCHES.forEach(function(m,mi){
    if(mi>0&&mi%6===0)h+='<tr style="background:rgba(10,18,36,0.3)"><td colspan="'+(2+PEOPLE.length)+'" style="padding:4px 8px;color:#90CAF9;font-weight:700;font-size:10px">Grupo '+m.g+'</td></tr>';
    h+='<tr><td>'+(mi+1)+'</td><td class="tn">'+fl(m.l)+' '+dn(m.l)+' vs '+dn(m.v)+'</td>';
    PEOPLE.forEach(function(p){
      var sc=(AP[p]||{})[mi]||'',parts=sc.split('-'),a=parts[0],b=parts[1],txt='-',cls='';
      if(a!==''&&b!==''){
        txt=a+'-'+b;
        if(parseInt(a)>parseInt(b))cls='gl';else if(parseInt(a)<parseInt(b))cls='gv';else cls='ge';
      }
      h+='<td><span class="'+cls+'" style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600">'+txt+'</span></td>';
    });
    h+='</tr>';
  });
  h+='</table></div>';
  document.getElementById('compararCont').innerHTML=h;
}

// Tabs
document.getElementById('tabBar').addEventListener('click',function(e){
  if(!e.target.classList.contains('tab'))return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('act')});
  e.target.classList.add('act');
  document.querySelectorAll('.tab-c').forEach(function(tc){tc.classList.remove('show')});
  var tabId=e.target.dataset.tab;
  document.getElementById('tab'+tabId.charAt(0).toUpperCase()+tabId.slice(1)).classList.add('show');
  document.getElementById('personaSel').style.display=(tabId==='apuestas'||tabId==='comparar')?'flex':'none';
  if(tabId==='apuestas'){loadPersona(document.getElementById('persona').value)}
  if(tabId==='comparar'){rComparar()}
});

document.getElementById('persona').addEventListener('change',function(){loadPersona(this.value)});

// Init
initPersonaSel();
rG();rQ();rB();
</script>
